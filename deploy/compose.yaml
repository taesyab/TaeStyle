services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: taestyle
      POSTGRES_DB: taestyle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taestyle-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taestyle -d taestyle"]
      interval: 5s
      retries: 12
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=db;Database=taestyle;Username=taestyle;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  taestyle-data:
