name: TaeStyle checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taestyle
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taestyle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taestyle -d taestyle_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TAESTYLE_TEST_DATABASE: Host=localhost;Database=taestyle_test;Username=taestyle;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore backend/TaeStyle.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1903,NU1904
      - run: dotnet test backend/TaeStyle.sln --no-restore --configuration Release
      - run: docker build -f deploy/Dockerfile -t taestyle-api .
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile/tae_style
      - run: flutter analyze
        working-directory: mobile/tae_style
      - run: flutter test
        working-directory: mobile/tae_style
      - run: flutter build apk --debug
        working-directory: mobile/tae_style
      - uses: actions/upload-artifact@v4
        with:
          name: TaeStyle-debug
          path: mobile/tae_style/build/app/outputs/flutter-apk/app-debug.apk
